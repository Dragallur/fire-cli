[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-cli"
version = "0.1.0"
description = "Download fire danger indices and active-fire detections and turn them into GIS-ready rasters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cdsapi>=0.7.4",
    "requests>=2.28",
    "pandas>=2.0",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "pillow>=9",
    "pyyaml>=6",
    "click>=8.1",
    "matplotlib>=3.7",
    "imageio>=2.28",
    "imageio-ffmpeg>=0.4.8",
]

[project.scripts]
fire-cli = "fire_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
fire_cli = ["examples/*.yaml"]
